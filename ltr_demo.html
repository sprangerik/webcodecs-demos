<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCodecs LTR Demo</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg-page: #f0f3f8;
            --bg-card: #ffffff;
            --border-subtle: #dde3ec;
            --text-primary: #1f2937;
            --text-muted: #5b6677;
            --brand: #0b57d0;
            --brand-hover: #0842a0;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --video-aspect: 1.7777778;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
        }

        .app-shell {
            height: 100vh;
            max-width: 1800px;
            margin: 0 auto;
            padding: 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        .top-bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--brand);
            letter-spacing: -0.01em;
        }

        #warningMessage {
            font-size: 0.82rem;
            color: var(--text-muted);
            background: #e8eef7;
            border: 1px solid #cfdbe9;
            padding: 5px 11px;
            border-radius: 6px;
            line-height: 1.35;
        }

        #warningMessage code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            background: rgba(255, 255, 255, 0.75);
            padding: 1px 5px;
            border-radius: 4px;
            color: #1e3a8a;
        }

        #warningMessage.highlight-warning {
            background-color: #fef2f2;
            border-color: #f87171;
            color: #991b1b;
            font-weight: 600;
        }

        .main-container {
            flex: 1 1 0;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
        }

        .quadrant {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-card);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
            overflow: hidden;
        }

        .video-stage {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            container-type: size;
        }

        .video-frame {
            position: relative;
            aspect-ratio: var(--video-aspect);
            width: min(100cqw, calc(100cqh * var(--video-aspect)));
            max-width: 100%;
            max-height: 100%;
            background-color: #0b0f17;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }

        .video-frame > video,
        .video-frame > canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }

        #rawVideo {
            transform: scaleX(-1);
        }

        .view-label {
            position: absolute;
            top: 8px;
            left: 8px;
            background-color: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(4px);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            pointer-events: none;
        }

        .settings {
            width: min(100%, 540px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(6px, 1.1vh, 12px);
        }

        .settings h2 {
            margin: 0 0 2px 0;
            font-size: 1.02rem;
            color: var(--brand);
        }

        .setting-row {
            display: grid;
            grid-template-columns: 140px minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
        }

        .setting-row.select-row {
            grid-template-columns: 140px minmax(0, 1fr);
        }

        .setting-row label {
            font-size: 0.86rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .settings select {
            width: 100%;
            padding: 6px 10px;
            font-size: 0.88rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #fff;
            color: var(--text-primary);
        }

        .settings input[type="range"] {
            width: 100%;
            margin: 0;
            accent-color: var(--brand);
            cursor: pointer;
        }

        .value-readout {
            min-width: 76px;
            text-align: right;
            font-size: 0.84rem;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            font-weight: 500;
        }

        .setting-actions {
            display: flex;
            justify-content: flex-start;
            padding-top: 2px;
        }

        .controls {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 2px 0;
        }

        button {
            padding: 8px 20px;
            font-size: 0.92rem;
            font-weight: 600;
            background-color: var(--brand);
            color: #ffffff;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s ease, opacity 0.15s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--brand-hover);
        }

        button.secondary {
            background-color: #eef3fb;
            color: var(--brand);
            border-color: #c7d7f4;
            padding: 6px 14px;
            font-size: 0.85rem;
        }

        button.secondary:hover:not(:disabled) {
            background-color: #dfe9fa;
        }

        button.danger {
            background-color: var(--danger);
        }

        button.danger:hover:not(:disabled) {
            background-color: var(--danger-hover);
        }

        button:disabled {
            background-color: #dce2ec;
            border-color: transparent;
            color: #7c8798;
            cursor: not-allowed;
        }

        @media (max-width: 960px), (max-height: 680px) {
            .app-shell {
                height: auto;
                min-height: 100vh;
                overflow: visible;
            }

            .main-container {
                flex: none;
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            .video-stage {
                container-type: normal;
            }

            .video-frame {
                width: 100%;
                max-width: 640px;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="top-bar">
            <h1>WebCodecs LTR Demo</h1>
            <div id="warningMessage">
                Uses experimental WebCodecs manual reference control &mdash; enable <code>chrome://flags/#enable-experimental-web-platform-features</code>.
            </div>
        </header>

        <div class="main-container">
            <div class="quadrant">
                <div class="video-stage">
                    <div class="video-frame">
                        <video id="rawVideo" autoplay muted playsinline></video>
                        <div class="view-label">Self View</div>
                    </div>
                </div>
            </div>

            <div class="quadrant">
                <div class="video-stage">
                    <div class="video-frame">
                        <canvas id="standardCanvas" width="640" height="360"></canvas>
                        <div class="view-label">Standard View</div>
                    </div>
                </div>
            </div>

            <div class="quadrant">
                <div class="settings">
                    <h2>Settings</h2>
                    <div class="setting-row select-row">
                        <label for="codec">Codec:</label>
                        <select id="codec" disabled></select>
                    </div>
                    <div class="setting-row">
                        <label for="encoderBitrate">Encoder Target:</label>
                        <input type="range" id="encoderBitrate" min="100" max="2500" value="1000">
                        <span class="value-readout" id="encoderBitrateValue">1000 kbps</span>
                    </div>
                    <div class="setting-row">
                        <label for="transportBitrate">Transport Limit:</label>
                        <input type="range" id="transportBitrate" min="100" max="2500" value="1500">
                        <span class="value-readout" id="transportBitrateValue">1500 kbps</span>
                    </div>
                    <div class="setting-row">
                        <label for="rttDelay">RTT Delay:</label>
                        <input type="range" id="rttDelay" min="0" max="500" value="300">
                        <span class="value-readout" id="rttDelayValue">300 ms</span>
                    </div>
                    <div class="setting-row">
                        <label for="lossPercent">Loss Percent:</label>
                        <input type="range" id="lossPercent" min="0" max="100" value="12">
                        <span class="value-readout" id="lossPercentValue">12%</span>
                    </div>
                    <div class="setting-actions">
                        <button id="requestKeyframeButton" class="secondary" disabled>Request Keyframe</button>
                    </div>
                </div>
            </div>

            <div class="quadrant">
                <div class="video-stage">
                    <div class="video-frame">
                        <canvas id="decodedCanvas" width="640" height="360"></canvas>
                        <div class="view-label">LTR View</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startButton" disabled>Start Demo</button>
            <button id="stopButton" class="danger" disabled>Stop Demo</button>
        </div>
    </div>

    <script src="simple_rate_controller.js"></script>
    <script src="ltr_reference_controller.js"></script>
    <script src="simulated_frame_transport.js"></script>
    <script src="frame_assembler.js"></script>
    <script src="encoded_frame.js"></script>
    <script src="frame_metadata_store.js"></script>
    <script>
        /**
         * @fileoverview LTR Demo main script.
         * This script sets up two WebCodecs pipelines: one standard and one LTR-enabled.
         * It simulates network conditions and visualizes the output of both pipelines.
         */

        const rawVideo = document.getElementById('rawVideo');
        const decodedCanvas = document.getElementById('decodedCanvas');
        const decodedCtx = decodedCanvas.getContext('2d');
        const standardCanvas = document.getElementById('standardCanvas');
        const standardCtx = standardCanvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const codecSelect = document.getElementById('codec');
        const transportBitrateSlider = document.getElementById('transportBitrate');
        const transportBitrateValue = document.getElementById('transportBitrateValue');
        const encoderBitrateSlider = document.getElementById('encoderBitrate');
        const encoderBitrateValue = document.getElementById('encoderBitrateValue');
        const requestKeyframeButton = document.getElementById('requestKeyframeButton');
        const rttDelaySlider = document.getElementById('rttDelay');
        const rttDelayValue = document.getElementById('rttDelayValue');
        const lossPercentSlider = document.getElementById('lossPercent');
        const lossPercentValue = document.getElementById('lossPercentValue');

        const FRAMERATE = 30;
        const RC_MIN_QP = 10;
        const RC_MAX_QP = 50;
        const RC_ALPHA = 0.5;
        const RC_KP_BUFFER = 0.1;
        const RC_TARGET_FULLNESS = 30;
        const RC_MAX_BUFFER_LEVEL_MS = 600;

        const CODECS = [
            { name: 'H.264', codec: 'avc1.42001E', type: 'avc' },
            { name: 'H.265', codec: 'hev1.1.6.L93.B0', type: 'hevc' },
            { name: 'VP8', codec: 'vp8', type: 'vp8' },
            { name: 'VP9', codec: 'vp09.00.10.08', type: 'vp9' },
            { name: 'AV1', codec: 'av01.0.04M.08', type: 'av1' },
        ];

        let currentTransportBitrate = parseInt(transportBitrateSlider.value, 10) * 1000;
        let currentRttDelay = parseInt(rttDelaySlider.value, 10);
        let currentLossPercent = parseInt(lossPercentSlider.value, 10);

        let mediaStream = null;
        let standardPipeline = null;
        let ltrPipeline = null;
        let ltrController = null;
        let frameSource = null;
        let frameReader = null;
        let isRunning = false;
        let lastConfiguredCodec = '';

        /**
         * Creates a SimpleRateController configured for the selected codec type with
         * frame dropping and re-encoding disabled.
         * @param {string} codecType - Short codec identifier ('av1', 'vp9', 'vp8', 'avc', 'hevc').
         * @returns {SimpleRateController}
         */
        function createRateController(codecType) {
            return new SimpleRateController(
                codecType,
                RC_MIN_QP,
                RC_MAX_QP,
                parseInt(encoderBitrateSlider.value, 10) * 1000,
                FRAMERATE,
                performance.now(),
                RC_MAX_BUFFER_LEVEL_MS,
                RC_TARGET_FULLNESS,
                RC_ALPHA,
                RC_KP_BUFFER,
                -1, -1, -1, -1 // Disable drop/re-encode for this demo
            );
        }

        /**
         * Updates the bitrate for both rate controllers based on the slider value.
         */
        function updateRateController() {
            const newBitrate = parseInt(encoderBitrateSlider.value, 10) * 1000;
            const now = performance.now();
            for (const pipeline of [standardPipeline, ltrPipeline]) {
                if (pipeline && pipeline.rateController) {
                    pipeline.rateController.SetRates(
                        newBitrate,
                        FRAMERATE,
                        RC_MAX_BUFFER_LEVEL_MS,
                        RC_TARGET_FULLNESS,
                        now,
                        RC_ALPHA,
                        RC_KP_BUFFER,
                        -1, -1, -1, -1
                    );
                }
            }
        }

        /**
         * Populates the codec dropdown list with supported codecs found on the system.
         * Checks for both hardware and software encoder support for manual scalability mode.
         */
        async function populateCodecList() {
            codecSelect.innerHTML = '';
            const warningMessage = document.getElementById('warningMessage');
            warningMessage.classList.remove('highlight-warning');

            if (typeof VideoEncoder === 'undefined') {
                warningMessage.classList.add('highlight-warning');
                const option = document.createElement('option');
                option.textContent = 'WebCodecs VideoEncoder unavailable (requires HTTPS or localhost)';
                codecSelect.appendChild(option);
                codecSelect.disabled = true;
                startButton.disabled = true;
                return;
            }

            let foundCodec = false;
            for (const codecInfo of CODECS) {
                const baseConfig = {
                    codec: codecInfo.codec,
                    width: 640,
                    height: 480,
                    bitrateMode: 'quantizer',
                    scalabilityMode: 'manual',
                };

                for (const [suffix, label, accel] of [
                    ['hw', 'HW', 'prefer-hardware'],
                    ['sw', 'SW', 'prefer-software'],
                ]) {
                    try {
                        const support = await VideoEncoder.isConfigSupported({
                            ...baseConfig,
                            hardwareAcceleration: accel,
                        });
                        if (support.supported) {
                            const option = document.createElement('option');
                            option.value = `${codecInfo.type}-${suffix}`;
                            option.textContent = `${codecInfo.name} (${label})`;
                            codecSelect.appendChild(option);
                            foundCodec = true;
                        }
                    } catch (e) {
                        console.warn(`Error checking ${label} support for ${codecInfo.name}:`, e);
                    }
                }
            }

            if (!foundCodec) {
                warningMessage.classList.add('highlight-warning');
                const option = document.createElement('option');
                option.textContent = 'No codecs with manual mode support found';
                codecSelect.appendChild(option);
                codecSelect.disabled = true;
                startButton.disabled = true;
            } else {
                codecSelect.disabled = false;
                const av1Sw = codecSelect.querySelector('option[value="av1-sw"]');
                if (av1Sw) av1Sw.selected = true; // Default to AV1 SW if available
                startButton.disabled = false;
            }
        }

        /**
         * Generates the VideoEncoder configuration object.
         * @param {boolean} isLtr - True if configuring for the LTR pipeline.
         * @returns {VideoEncoderConfig} The encoder configuration.
         */
        function getEncoderConfig(isLtr) {
            const [type, accel] = codecSelect.value.split('-');

            const encoderConfig = {
                codec: '',
                width: rawVideo.videoWidth || 640,
                height: rawVideo.videoHeight || 360,
                framerate: FRAMERATE,
                bitrateMode: 'quantizer',
            };

            if (isLtr) {
                encoderConfig.scalabilityMode = 'manual';
            }

            if (accel === 'hw') {
                encoderConfig.hardwareAcceleration = 'prefer-hardware';
            } else if (accel === 'sw') {
                encoderConfig.hardwareAcceleration = 'prefer-software';
            }

            switch (type) {
                case 'avc':
                    encoderConfig.codec = 'avc1.42001E';
                    encoderConfig.avc = { format: 'annexb' };
                    break;
                case 'hevc':
                    encoderConfig.codec = 'hev1.1.6.L93.B0';
                    encoderConfig.hevc = { format: 'annexb' };
                    break;
                case 'vp8':
                    encoderConfig.codec = 'vp8';
                    break;
                case 'vp9':
                    encoderConfig.codec = 'vp09.00.10.08';
                    break;
                case 'av1':
                    encoderConfig.codec = 'av01.0.04M.08';
                    break;
            }
            return encoderConfig;
        }

        /**
         * Generates the VideoDecoder configuration object.
         * @param {VideoEncoderConfig} encoderConfig - The corresponding encoder configuration.
         * @param {ArrayBuffer} [description=null] - Optional decoder description from encoder metadata.
         * @returns {VideoDecoderConfig} The decoder configuration.
         */
        function getDecoderConfig(encoderConfig, description = null) {
            const decoderConfig = {
                codec: encoderConfig.codec,
                codedWidth: encoderConfig.width,
                codedHeight: encoderConfig.height,
                hardwareAcceleration: 'prefer-software', // Force software decoding for stability
            };
            if (encoderConfig.avc) decoderConfig.avc = { ...encoderConfig.avc };
            if (encoderConfig.hevc) decoderConfig.hevc = { ...encoderConfig.hevc };
            if (description) decoderConfig.description = description;
            return decoderConfig;
        }

        /**
         * Sets the quantizer parameter in the encode options based on the codec type.
         * @param {object} encodeOptions - The base encode options object.
         * @param {number} qp - The quantization parameter in the demo's 0-63 scale.
         * @param {string} codecType - The codec type (e.g., 'av1', 'vp9').
         */
        function setQpEncodeOptions(encodeOptions, qp, codecType) {
            const clampedQp = Math.max(0, qp);
            switch (codecType) {
                // AV1 and VP9 use the full 0-255 QIndex range in WebCodecs; translate from 0-63.
                case 'av1':
                    encodeOptions.av1 = { quantizer: Math.min(255, clampedQp * 4) };
                    break;
                case 'vp9':
                    encodeOptions.vp9 = { quantizer: Math.min(255, clampedQp * 4) };
                    break;
                case 'vp8':
                    encodeOptions.vp8 = { quantizer: Math.min(63, clampedQp) };
                    break;
                case 'avc':
                    encodeOptions.avc = { quantizer: Math.min(51, clampedQp) };
                    break;
                case 'hevc':
                    encodeOptions.hevc = { quantizer: Math.min(51, clampedQp) };
                    break;
            }
        }

        /**
         * Creates and configures a full encoding/decoding pipeline.
         * @param {boolean} isLtr - Whether this is the LTR-enabled pipeline.
         * @param {CanvasRenderingContext2D} drawCtx - The canvas context to render decoded frames to.
         * @returns {Promise<object>} The pipeline components.
         */
        async function createPipeline(isLtr, drawCtx) {
            const codecType = codecSelect.value.split('-')[0];
            const pipeline = {
                encoder: null,
                decoder: null,
                transport: null,
                frameAssembler: null,
                rateController: createRateController(codecType),
                frameMetadataStore: new FrameMetadataStore(),
                lastEncodedDescription: null,
                decoderConfiguredWithDescription: false,
                codecGeneration: 0,
                submittedFrameId: 0,
                outputFrameIdFallback: 0,
                lastOutputFrameId: -1,
                needsKeyFrame: true,
                isLtr: isLtr,
                name: isLtr ? 'LTR' : 'Standard',
                lastDisplayedTimestamp: -1,
            };

            // Initialize SimulatedFrameTransport
            pipeline.transport = new SimulatedFrameTransport((encodedFrame, meta) => {
                if (pipeline.frameAssembler) {
                    pipeline.frameAssembler.OnFrameReceived(encodedFrame);
                }
            }, currentRttDelay, currentLossPercent);
            pipeline.transport.SetRate(currentTransportBitrate);

            // Initialize FrameAssembler
            pipeline.frameAssembler = new FrameAssembler((encodedFrame) => {
                if (pipeline.decoder && pipeline.decoder.state === 'configured') {
                    try {
                        pipeline.decoder.decode(encodedFrame.encodedChunk);
                    } catch (e) {
                        console.error(`[${pipeline.name}] decoder.decode error:`, e);
                    }
                }
            });
            pipeline.frameAssembler.decoderNeedsKeyFrame = true;

            const encoderConfig = getEncoderConfig(isLtr);
            if (isLtr) lastConfiguredCodec = encoderConfig.codec;

            // Initialize VideoEncoder
            pipeline.encoder = new VideoEncoder({
                output: async (chunk, meta) => {
                    if (!isRunning) return;

                    const frameMetadata = pipeline.frameMetadataStore.getFrameMetadata(chunk.timestamp);
                    pipeline.frameMetadataStore.pruneOldMetadata(chunk.timestamp);
                    if (!frameMetadata || frameMetadata.codecGeneration !== pipeline.codecGeneration) {
                        return;
                    }

                    // Initialize VideoDecoder if not already done
                    if (!pipeline.decoder) {
                        pipeline.lastEncodedDescription = meta?.decoderConfig?.description || null;
                        const currentEncoderConfig = getEncoderConfig(pipeline.isLtr);
                        const decoderConfig = getDecoderConfig(currentEncoderConfig, pipeline.lastEncodedDescription);

                        pipeline.decoder = new VideoDecoder({
                            output: (frame) => {
                                const ts = frame.timestamp;
                                try {
                                    if (ts > pipeline.lastDisplayedTimestamp) {
                                        drawCtx.drawImage(frame, 0, 0, drawCtx.canvas.width, drawCtx.canvas.height);
                                        pipeline.lastDisplayedTimestamp = ts;
                                    }
                                } catch (e) {
                                    console.error(`[${pipeline.name}] Decoder drawImage error:`, e);
                                } finally {
                                    frame.close();
                                }
                            },
                            error: (e) => {
                                console.error(`[${pipeline.name}] Decoder Error:`, e);
                                pipeline.needsKeyFrame = true;
                                if (pipeline.frameAssembler) {
                                    pipeline.frameAssembler.decoderNeedsKeyFrame = true;
                                }
                            },
                        });

                        try {
                            await pipeline.decoder.configure(decoderConfig);
                            pipeline.decoderConfiguredWithDescription = pipeline.lastEncodedDescription != null;
                        } catch (e) {
                            console.error(`[${pipeline.name}] Error configuring decoder:`, e);
                            pipeline.decoder = null;
                            return;
                        }
                    } else if (!pipeline.decoderConfiguredWithDescription && meta?.decoderConfig?.description) {
                        // Reconfigure decoder if description appears later
                        pipeline.lastEncodedDescription = meta.decoderConfig.description;
                        const currentEncoderConfig = getEncoderConfig(pipeline.isLtr);
                        const decoderConfig = getDecoderConfig(currentEncoderConfig, pipeline.lastEncodedDescription);
                        if (pipeline.decoder && pipeline.decoder.state !== 'closed') {
                            try {
                                await pipeline.decoder.configure(decoderConfig);
                                pipeline.decoderConfiguredWithDescription = true;
                                if (pipeline.frameAssembler) {
                                    pipeline.frameAssembler.decoderNeedsKeyFrame = true;
                                }
                            } catch (e) {
                                console.error(`[${pipeline.name}] Error reconfiguring decoder:`, e);
                            }
                        }
                    }
                    if (!pipeline.decoderConfiguredWithDescription && chunk.type === 'key') {
                        pipeline.decoderConfiguredWithDescription = true;
                    }

                    pipeline.outputFrameIdFallback++;
                    const isKeyFrame = chunk.type === 'key';
                    const frameId = frameMetadata ? frameMetadata.frameId : pipeline.outputFrameIdFallback;
                    const isLtrFrame = frameMetadata ? Boolean(frameMetadata.isLtr) : false;
                    const qpUsed = frameMetadata ? frameMetadata.qp : RC_MIN_QP;

                    let dependencies = [];
                    if (!isKeyFrame) {
                        if (frameMetadata && Array.isArray(frameMetadata.dependencies)) {
                            dependencies = frameMetadata.dependencies;
                        } else if (pipeline.isLtr && ltrController) {
                            dependencies = ltrController.GetLastGoodFrameIds();
                        } else if (pipeline.lastOutputFrameId !== -1) {
                            dependencies = [pipeline.lastOutputFrameId];
                        }
                    }

                    const encodedFrame = new EncodedFrame(chunk, frameId, dependencies, chunk.timestamp, isLtrFrame);
                    pipeline.lastOutputFrameId = frameId;

                    pipeline.rateController.OnEncodedFrame(performance.now(), chunk.byteLength, qpUsed, isKeyFrame);

                    if (pipeline.transport) {
                        pipeline.transport.SendFrame(encodedFrame, meta);
                    }
                },
                error: (e) => {
                    console.error(`[${pipeline.name}] Encoder Error:`, e);
                },
            });
            await pipeline.encoder.configure(encoderConfig);
            return pipeline;
        }

        /**
         * Starts the video encoding process for both pipelines.
         */
        async function startEncoding() {
            if (!mediaStream) return;

            const track = mediaStream.getVideoTracks()[0];
            const processor = new MediaStreamTrackProcessor({ track });
            frameSource = processor.readable;

            isRunning = true;
            standardPipeline = await createPipeline(false, standardCtx);
            ltrPipeline = await createPipeline(true, decodedCtx);

            const buffers = await ltrPipeline.encoder.getAllFrameBuffers();
            ltrController = new LtrReferenceController(buffers);
            ltrPipeline.transport.ltrController = ltrController;

            frameReader = frameSource.getReader();
            requestKeyframeButton.disabled = false;

            /**
             * Reads frames from the camera and encodes them with both pipelines.
             */
            async function processFrames() {
                while (isRunning && frameReader) {
                    let readResult;
                    try {
                        readResult = await frameReader.read();
                    } catch (e) {
                        if (isRunning) {
                            console.error('Error reading camera frame:', e);
                        }
                        break;
                    }

                    const { done, value: frame } = readResult;
                    if (done || !frame) break;

                    if (!isRunning) {
                        frame.close();
                        break;
                    }

                    const timestamp = frame.timestamp;
                    const codecType = codecSelect.value.split('-')[0];
                    const now = performance.now();

                    // Standard Encoding
                    if (standardPipeline && standardPipeline.encoder?.state === 'configured') {
                        const keyFrame = standardPipeline.needsKeyFrame;
                        const prevFrameId = standardPipeline.submittedFrameId;
                        standardPipeline.submittedFrameId++;
                        const frameId = standardPipeline.submittedFrameId;
                        const qp = standardPipeline.rateController.GetNextQp(now, keyFrame);
                        if (qp >= 0) {
                            const encodeOptions = { keyFrame };
                            setQpEncodeOptions(encodeOptions, qp, codecType);
                            standardPipeline.frameMetadataStore.addFrameMetadata(timestamp, {
                                qp,
                                frameId,
                                codecGeneration: standardPipeline.codecGeneration,
                                dependencies: keyFrame || prevFrameId === 0 ? [] : [prevFrameId],
                            });
                            standardPipeline.encoder.encode(frame, encodeOptions);
                            standardPipeline.needsKeyFrame = false;
                        }
                    }

                    // LTR Encoding
                    if (ltrPipeline && ltrPipeline.encoder?.state === 'configured' && ltrController) {
                        const keyFrame = ltrPipeline.needsKeyFrame;
                        ltrPipeline.submittedFrameId++;
                        const frameId = ltrPipeline.submittedFrameId;
                        const qpLtr = ltrPipeline.rateController.GetNextQp(now, keyFrame);
                        if (qpLtr >= 0) {
                            const ltrResult = ltrController.GetNextEncodeOptions(keyFrame, frameId);
                            const encodeOptionsLtr = ltrResult.encodeOptions;
                            setQpEncodeOptions(encodeOptionsLtr, qpLtr, codecType);
                            ltrPipeline.frameMetadataStore.addFrameMetadata(timestamp, {
                                qp: qpLtr,
                                frameId,
                                codecGeneration: ltrPipeline.codecGeneration,
                                isLtr: ltrResult.isLtr,
                                dependencies: ltrResult.referenceFrameIds,
                            });
                            ltrPipeline.encoder.encode(frame, encodeOptionsLtr);
                            ltrPipeline.needsKeyFrame = false;
                        }
                    }

                    frame.close();
                }
            }

            processFrames();
        }

        /**
         * Stops the encoding process and cleans up resources.
         */
        async function stopEncoding() {
            isRunning = false;
            requestKeyframeButton.disabled = true;

            if (frameReader) {
                try {
                    await frameReader.cancel();
                } catch (e) {
                    console.warn('Error cancelling frameReader:', e);
                }
                frameReader = null;
            }
            frameSource = null;

            const cleanupPipeline = async (pipe, name) => {
                if (!pipe) return;
                if (pipe.transport) pipe.transport.Stop();
                if (pipe.encoder && pipe.encoder.state !== 'closed') {
                    try {
                        await pipe.encoder.flush();
                    } catch (e) {
                        console.error(`Error flushing ${name} encoder:`, e);
                    }
                    if (pipe.encoder.state !== 'closed') {
                        pipe.encoder.close();
                    }
                }
                if (pipe.decoder && pipe.decoder.state !== 'closed') {
                    try {
                        await pipe.decoder.flush();
                    } catch (e) {
                        console.error(`Error flushing ${name} decoder:`, e);
                    }
                    if (pipe.decoder.state !== 'closed') {
                        pipe.decoder.close();
                    }
                }
                if (pipe.frameAssembler) pipe.frameAssembler.reset();
                if (pipe.frameMetadataStore) pipe.frameMetadataStore.clear();
            };

            await cleanupPipeline(standardPipeline, 'Standard');
            await cleanupPipeline(ltrPipeline, 'LTR');
            standardPipeline = null;
            ltrPipeline = null;
            ltrController = null;

            decodedCtx.clearRect(0, 0, decodedCanvas.width, decodedCanvas.height);
            standardCtx.clearRect(0, 0, standardCanvas.width, standardCanvas.height);
        }

        /**
         * Reconfigures the encoders and decoders if the codec selection changes while running.
         */
        async function reconfigureEncoder() {
            if (!isRunning) return;

            const codecType = codecSelect.value.split('-')[0];
            const reconfig = async (pipe) => {
                if (!pipe || !pipe.encoder || pipe.encoder.state !== 'configured') return false;
                const encoderConfig = getEncoderConfig(pipe.isLtr);
                const codecChanged = encoderConfig.codec !== lastConfiguredCodec;
                if (codecChanged) {
                    pipe.codecGeneration++;
                    if (pipe.transport) {
                        pipe.transport.ClearPending();
                    }
                    if (pipe.frameAssembler) {
                        pipe.frameAssembler.reset();
                        pipe.frameAssembler.decoderNeedsKeyFrame = true;
                    }
                    pipe.frameMetadataStore.clear();
                    pipe.decoderConfiguredWithDescription = false;
                    pipe.lastEncodedDescription = null;
                    if (pipe.decoder && pipe.decoder.state !== 'closed') {
                        try {
                            await pipe.decoder.configure(getDecoderConfig(encoderConfig, null));
                        } catch (e) {
                            console.error(`Error reconfiguring ${pipe.name} decoder:`, e);
                        }
                    }
                }

                await pipe.encoder.configure(encoderConfig);
                pipe.rateController = createRateController(codecType);

                if (pipe.isLtr) {
                    const buffers = await pipe.encoder.getAllFrameBuffers();
                    ltrController = new LtrReferenceController(buffers);
                    if (pipe.transport) {
                        pipe.transport.ltrController = ltrController;
                    }
                }
                pipe.needsKeyFrame = true;
                return true;
            };

            const standardChanged = await reconfig(standardPipeline);
            const ltrChanged = await reconfig(ltrPipeline);

            if (standardChanged || ltrChanged) {
                lastConfiguredCodec = getEncoderConfig(false).codec;
            }
        }

        // Event Listeners
        transportBitrateSlider.addEventListener('input', () => {
            transportBitrateValue.textContent = `${transportBitrateSlider.value} kbps`;
            currentTransportBitrate = parseInt(transportBitrateSlider.value, 10) * 1000;
            if (standardPipeline?.transport) standardPipeline.transport.SetRate(currentTransportBitrate);
            if (ltrPipeline?.transport) ltrPipeline.transport.SetRate(currentTransportBitrate);
        });

        encoderBitrateSlider.addEventListener('input', () => {
            encoderBitrateValue.textContent = `${encoderBitrateSlider.value} kbps`;
            updateRateController();
        });

        rttDelaySlider.addEventListener('input', () => {
            rttDelayValue.textContent = `${rttDelaySlider.value} ms`;
            currentRttDelay = parseInt(rttDelaySlider.value, 10);
            if (standardPipeline?.transport) standardPipeline.transport.SetRttDelay(currentRttDelay);
            if (ltrPipeline?.transport) ltrPipeline.transport.SetRttDelay(currentRttDelay);
        });

        lossPercentSlider.addEventListener('input', () => {
            lossPercentValue.textContent = `${lossPercentSlider.value}%`;
            currentLossPercent = parseInt(lossPercentSlider.value, 10);
            if (standardPipeline?.transport) standardPipeline.transport.SetLossPercent(currentLossPercent);
            if (ltrPipeline?.transport) ltrPipeline.transport.SetLossPercent(currentLossPercent);
        });

        codecSelect.addEventListener('change', () => reconfigureEncoder());

        requestKeyframeButton.addEventListener('click', () => {
            if (standardPipeline) standardPipeline.needsKeyFrame = true;
            if (ltrPipeline) ltrPipeline.needsKeyFrame = true;
        });

        startButton.addEventListener('click', async () => {
            startButton.disabled = true;
            stopButton.disabled = true;
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 360 },
                    audio: false,
                });
                rawVideo.srcObject = mediaStream;
                await rawVideo.play();

                const videoWidth = rawVideo.videoWidth || 640;
                const videoHeight = rawVideo.videoHeight || 360;
                document.documentElement.style.setProperty(
                    '--video-aspect',
                    String(videoWidth / videoHeight)
                );
                [decodedCanvas, standardCanvas].forEach((canvas) => {
                    canvas.width = videoWidth;
                    canvas.height = videoHeight;
                });

                stopButton.disabled = false;
                await startEncoding();
            } catch (err) {
                console.error('Error accessing camera:', err);
                alert('Could not access camera. Please ensure permission is granted.');
                startButton.disabled = false;
            }
        });

        stopButton.addEventListener('click', async () => {
            stopButton.disabled = true;
            await stopEncoding();
            if (mediaStream) {
                mediaStream.getTracks().forEach((track) => track.stop());
                mediaStream = null;
                rawVideo.srcObject = null;
            }
            startButton.disabled = false;
        });

        window.addEventListener('load', () => populateCodecList());
    </script>
</body>
</html>
