<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Tests</title>
</head>
<body>
    <h1>Running Unit Tests... Check Console</h1>

    <script src="frame_assembler.js"></script>
    <script src="simulated_frame_transport.js"></script>
    <script src="ltr_reference_controller.js"></script>
    <script src="simple_rate_controller.js"></script>
    <script src="encoded_frame.js"></script>

    <script>
        // Basic Assertion Utility
        const assert = {
            _testCount: 0,
            _failCount: 0,
            _results: [],

            _logResult: function(isSuccess, message) {
                this._testCount++;
                const result = {
                    test: message,
                    status: isSuccess ? 'PASS' : 'FAIL',
                };
                this._results.push(result);
                if (isSuccess) {
                    console.log(`%cPASS: ${message}`, 'color: green');
                } else {
                    this._failCount++;
                    console.error(`%cFAIL: ${message}`, 'color: red');
                }
            },

            strictEqual: function(actual, expected, message) {
                const isSuccess = (actual === expected);
                this._logResult(isSuccess, message + ` (Expected: ${expected}, Got: ${actual})`);
            },

            deepStrictEqual: function(actual, expected, message) {
                const isSuccess = JSON.stringify(actual) === JSON.stringify(expected);
                this._logResult(isSuccess, message + ` (Expected: ${JSON.stringify(expected)}, Got: ${JSON.stringify(actual)})`);
            },

            isTrue: function(condition, message) {
                this._logResult(condition, message);
            },

            isFalse: function(condition, message) {
                this._logResult(!condition, message);
            },

            summary: function() {
                const summary = {
                    total: this._testCount,
                    passed: this._testCount - this._failCount,
                    failed: this._failCount,
                    results: this._results
                };
                console.log('\n--- Test Summary ---');
                if (this._failCount === 0) {
                    console.log(`%cAll ${this._testCount} tests passed!`, 'color: green; font-weight: bold;');
                } else {
                    console.error(`%c${this._failCount} of ${this._testCount} tests failed.`, 'color: red; font-weight: bold;');
                }
                console.log('--- JSON Test Results ---');
                console.log(JSON.stringify(summary, null, 2));
                return this._failCount === 0;
            }
        };

        // --- Unit Tests for FrameAssembler ---
        function runFrameAssemblerTests() {
            console.log('\n--- Running FrameAssembler Tests ---');

            let decodedFrames = [];
            const onReadyToRenderCallback = (encodedFrame) => {
                decodedFrames.push(encodedFrame.frameId);
            };

            const assembler = new FrameAssembler(onReadyToRenderCallback);

            // Mock EncodedVideoChunk for testing
            const createMockEncodedChunk = (type, timestamp) => ({
                type: type,
                timestamp: timestamp,
                byteLength: 100, // Dummy value
                data: new ArrayBuffer(100) // Dummy data
            });

            // Test Case 1: Keyframe should be decoded immediately
            decodedFrames = [];
            assembler.reset();
            assembler.decoderNeedsKeyFrame = true; // Simulate decoder needing a keyframe
            const keyFrame1 = new EncodedFrame(createMockEncodedChunk('key', 1000), 1, [], 1000);
            assembler.OnFrameReceived(keyFrame1);
            assert.deepStrictEqual(decodedFrames, [1], 'Keyframe 1 should be decoded immediately');
            assert.isFalse(assembler.decoderNeedsKeyFrame, 'decoderNeedsKeyFrame should be false after keyframe');
            assert.strictEqual(assembler.bufferedFrames.size, 0, 'Buffered frames should be empty');

            // Test Case 2: Delta frame before keyframe should be buffered
            decodedFrames = [];
            assembler.reset();
            assembler.decoderNeedsKeyFrame = true;
            const deltaFrame1 = new EncodedFrame(createMockEncodedChunk('delta', 2000), 2, [1], 2000);
            assembler.OnFrameReceived(deltaFrame1);
            assert.deepStrictEqual(decodedFrames, [], 'Delta frame 1 should be buffered');
            assert.strictEqual(assembler.bufferedFrames.size, 1, 'Buffered frames should contain 1 frame');
            assert.isTrue(assembler.decoderNeedsKeyFrame, 'decoderNeedsKeyFrame should still be true');

            // Test Case 3: Keyframe after buffered delta frame should decode both
            decodedFrames = [];
            assembler.reset();
            assembler.decoderNeedsKeyFrame = true;
            const deltaFrame2 = new EncodedFrame(createMockEncodedChunk('delta', 2000), 2, [1], 2000);
            const deltaFrame3 = new EncodedFrame(createMockEncodedChunk('delta', 3000), 3, [2], 3000);
            assembler.OnFrameReceived(deltaFrame2);
            assembler.OnFrameReceived(deltaFrame3);
            assert.strictEqual(assembler.bufferedFrames.size, 2, 'Buffered frames should contain 2 frames');
            assert.deepStrictEqual(decodedFrames, [], 'No frames decoded yet');

            const keyFrame2 = new EncodedFrame(createMockEncodedChunk('key', 1000), 1, [], 1000);
            assembler.OnFrameReceived(keyFrame2);
            // Expect keyFrame2 (ID 1), then deltaFrame2 (ID 2), then deltaFrame3 (ID 3)
            assert.deepStrictEqual(decodedFrames, [1, 2, 3], 'Keyframe 2 should decode itself and buffered frames');
            assert.strictEqual(assembler.bufferedFrames.size, 0, 'Buffered frames should be empty after decoding');
            assert.isFalse(assembler.decoderNeedsKeyFrame, 'decoderNeedsKeyFrame should be false after keyframe');

            // Test Case 4: Frames arriving out of order but dependencies met
            decodedFrames = [];
            assembler.reset();
            assembler.decoderNeedsKeyFrame = false; // Assume decoder is already initialized
            const frameA = new EncodedFrame(createMockEncodedChunk('delta', 2000), 2, [1], 2000);
            const frameB = new EncodedFrame(createMockEncodedChunk('delta', 3000), 3, [1, 2], 3000);
            const frameC = new EncodedFrame(createMockEncodedChunk('delta', 4000), 4, [3], 4000);
            const frame1 = new EncodedFrame(createMockEncodedChunk('key', 1000), 1, [], 1000);

            assembler.OnFrameReceived(frameA); // Buffered
            assembler.OnFrameReceived(frameC); // Buffered
            assembler.OnFrameReceived(frameB); // Buffered
            assert.deepStrictEqual(decodedFrames, [], 'No frames decoded yet');
            assert.strictEqual(assembler.bufferedFrames.size, 3, 'All frames buffered');

            assembler.OnFrameReceived(frame1); // Keyframe, should trigger decoding of A, B, C
            assert.deepStrictEqual(decodedFrames, [1, 2, 3, 4], 'All frames should be decoded in order');
            assert.strictEqual(assembler.bufferedFrames.size, 0, 'Buffered frames should be empty');

            // Test Case 5: _clearOldState functionality
            decodedFrames = [];
            assembler.reset();
            assembler.decoderNeedsKeyFrame = true;
            const oldFrame = new EncodedFrame(createMockEncodedChunk('delta', 100), 1, [], 100);
            const currentFrame = new EncodedFrame(createMockEncodedChunk('key', 1000), 2, [], 1000);
            assembler.OnFrameReceived(oldFrame); // Should be buffered
            assert.strictEqual(assembler.bufferedFrames.size, 1, 'Old frame should be buffered');
            assembler.OnFrameReceived(currentFrame); // Should decode and clear oldFrame
            assert.deepStrictEqual(decodedFrames, [2], 'Only current keyframe should be decoded');
            assert.strictEqual(assembler.bufferedFrames.size, 0, 'Old buffered frame should be cleared');

            // Test Case 6: Reset functionality
            assembler.reset();
            assert.strictEqual(assembler.decodedFrames.size, 0, 'Decoded frames should be empty after reset');
            assert.strictEqual(assembler.bufferedFrames.size, 0, 'Buffered frames should be empty after reset');
            assert.isFalse(assembler.decoderNeedsKeyFrame, 'decoderNeedsKeyFrame should be false after reset');
        }


        // --- Unit Tests for SimpleRateController ---
        function runSimpleRateControllerTests() {
            console.log('\n--- Running SimpleRateController Tests ---');
            const baseTime = 10000; // Fake start time
            let result; // Declare result here

            // Test Case 1: Constructor and initial state

            let now = baseTime;
            let controller = new SimpleRateController('avc', 10, 50, 1000000, 30, now, 500, 70, 0.5, 0.1, 95, 20, 20, 2);

            assert.strictEqual(controller.codecType, 'avc', 'Constructor should set codecType');
            assert.strictEqual(controller.minQp, 10, 'Constructor should set minQp');
            assert.strictEqual(controller.maxQp, 50, 'Constructor should set maxQp');
            assert.strictEqual(controller.targetBitrate, 1000000, 'Constructor should set targetBitrate');
            assert.strictEqual(controller.framerate, 30, 'Constructor should set framerate');
            assert.strictEqual(controller.maxBufferLevelMs, 500, 'Constructor should set maxBufferLevelMs');
            assert.strictEqual(controller.targetFullnessPercent, 70, 'Constructor should set targetFullnessPercent');
            assert.strictEqual(controller.alpha, 0.5, 'Constructor should set alpha');
            assert.strictEqual(controller.Kp_buffer, 0.1, 'Constructor should set Kp_buffer');
            assert.strictEqual(controller.frameDropThresholdPercent, 95, 'Constructor should set default frameDropThresholdPercent');
            assert.strictEqual(controller.reencodeOvershootPercent, 20, 'Constructor should set default reencodeOvershootPercent');
            assert.strictEqual(controller.reencodeUndershootPercent, 20, 'Constructor should set default reencodeUndershootPercent');
            assert.strictEqual(controller.maxReencodeCount, 2, 'Constructor should set default maxReencodeCount');
            assert.isTrue(controller._qpDiffToSizeRatioMap instanceof Map, 'QP to Size Ratio map should be a Map');

            // Test Case 2: _qpChangeFromSizeRatioChange()
            assert.strictEqual(controller._qpChangeFromSizeRatioChange(1), 0, '_qpChangeFromSizeRatioChange(1) should be 0');
            assert.isTrue(controller._qpChangeFromSizeRatioChange(0.5) > 0, '_qpChangeFromSizeRatioChange(0.5) should be positive');
            assert.isTrue(controller._qpChangeFromSizeRatioChange(2.0) < 0, '_qpChangeFromSizeRatioChange(2.0) should be negative');

            // Test Case 3: OnEncodedFrame() - Basic update
            now = baseTime + 1000;
            controller = new SimpleRateController('avc', 10, 50, 1000000, 30, now, 500, 70, 0.5, 0.1);
            controller.avgQp = 30; // Reset avgQp
            const frameTime1 = now + 1;
            const targetFrameSizeBytes = Math.floor((controller.targetBitrate / controller.framerate) / 8);
            let currentQp = controller.GetNextQp(frameTime1, false);
            // Adjust frameSize1 to be slightly larger than target to avoid undershoot
            const frameSize1 = targetFrameSizeBytes * 1.1; 
            result = controller.OnEncodedFrame(frameTime1, frameSize1, currentQp, false);
            console.log('Test Case 3, result1:', result);

            if (!result.reencode) {
                assert.isTrue(controller.bitDebt > 0, 'Buffer debt should update after first frame');
                assert.strictEqual(controller.lastUpdateTime, frameTime1, 'Last update time should change');

                const frameTime2 = now + 34;
                const frameSize2 = targetFrameSizeBytes * 0.9;
                 currentQp = controller.GetNextQp(frameTime2, false);
                result = controller.OnEncodedFrame(frameTime2, frameSize2, currentQp, false);
                 console.log('Test Case 3, result2:', result);
                 if (!result.reencode) {
                    assert.isTrue(controller.lastUpdateTime === frameTime2, 'Last update time should update again');
                }
            }

            // Test Case 4: GetNextQp() - Normal operation
            now = baseTime + 2000;
            controller = new SimpleRateController('avc', 10, 50, 1000000, 30, now, 500, 70, 0.5, 0.1);
            controller.avgQp = 30; // Reset avgQp
            controller.bitDebt = controller.targetBufferLevelBits;
            const qpTarget = controller.GetNextQp(now + 1, false);
            assert.isTrue(qpTarget >= 10 && qpTarget <= 50, 'GetNextQp should return QP in range');

            // Test Case 9: SetRates()
            now = baseTime + 3000;
            controller = new SimpleRateController('avc', 10, 50, 1000000, 30, now, 500, 70, 0.5, 0.1);
            controller.SetRates(2000000, 60, 1000, 80, now + 1, 0.6, 0.2, 92, 25, 15, 3);
            assert.strictEqual(controller.targetBitrate, 2000000, 'SetRates should update targetBitrate');
            assert.strictEqual(controller.framerate, 60, 'SetRates should update framerate');
            assert.strictEqual(controller.maxBufferLevelMs, 1000, 'SetRates should update maxBufferLevelMs');
            assert.strictEqual(controller.targetFullnessPercent, 80, 'SetRates should update targetFullnessPercent');
            assert.strictEqual(controller.alpha, 0.6, 'SetRates should update alpha');
            assert.strictEqual(controller.Kp_buffer, 0.2, 'SetRates should update Kp_buffer');
            assert.strictEqual(controller.frameDropThresholdPercent, 92, 'SetRates should update frameDropThresholdPercent');
            assert.strictEqual(controller.reencodeOvershootPercent, 25, 'SetRates should update reencodeOvershootPercent');
            assert.strictEqual(controller.reencodeUndershootPercent, 15, 'SetRates should update reencodeUndershootPercent');
            assert.strictEqual(controller.maxReencodeCount, 3, 'SetRates should update maxReencodeCount');
            assert.strictEqual(controller.lastUpdateTime, now + 1, 'SetRates should update lastUpdateTime');

            // Test Case 10: Frame Drop
            now = baseTime + 4000;
            controller = new SimpleRateController('avc', 10, 50, 1000000, 30, now, 500, 70, 0.5, 0.1, 90, 20, 20, 2);
            controller.bitDebt = controller.maxBufferLevelBits * 0.91; // Above drop threshold
            let nextQp = controller.GetNextQp(now + 1, false);
            assert.strictEqual(nextQp, -1, 'GetNextQp should return -1 to signal frame drop');
            assert.strictEqual(controller.reEncodeContext.count, 0, 'Reencode count should remain 0 after frame drop');

            // Test Cases 11-13: Re-encode Logic (Overshoot)
            now = baseTime + 5000;
            const targetFullness = 70;
            const overshoot = 20;
            controller = new SimpleRateController('avc', 10, 50, 1000000, 30, now, 500, targetFullness, 0.5, 0.1, 95, overshoot, 20, 2);
            controller.avgQp = 30; // Reset avgQp
            const bitsPerFrame = controller.targetBitrate / controller.framerate;
            // Set bitDebt to the target to start from a neutral point
            controller.bitDebt = controller.targetBufferLevelBits;

            // Test Case 11: Re-encode Trigger on Overshoot
            nextQp = controller.GetNextQp(now + 1, false); // Still call to set targetSize
            const initialQp = 30; // Force mid-range QP
            assert.isTrue(initialQp >= 10 && initialQp <= 50, 'GetNextQp should return a valid QP');

            // This frame size will push the potential buffer level over targetFullness + overshoot
            const largeFrameSizeBytes = Math.floor(((controller.maxBufferLevelBits * (targetFullness + overshoot + 15)) / 100 - controller.bitDebt) / 8);
            result = controller.OnEncodedFrame(now + 34, largeFrameSizeBytes, initialQp, false);
            assert.isTrue(result.reencode, 'OnEncodedFrame should signal reencode for overshoot');
            assert.strictEqual(controller.reEncodeContext.count, 1, 'Reencode count should be incremented');
            assert.isTrue(result.qp > initialQp, 'Reencode should suggest a higher QP for overshoot');

            // Test Case 12: Re-encode Second Attempt
            const secondQp = result.qp;
            console.log('Test Case 12 reEncodeContext:', JSON.stringify(controller.reEncodeContext));
            result = controller.OnEncodedFrame(now + 34, largeFrameSizeBytes, secondQp, false); // Same timestamp
            assert.isTrue(result.reencode, 'OnEncodedFrame should signal reencode again');
            assert.strictEqual(controller.reEncodeContext.count, 2, 'Reencode count should be 2');
            assert.isTrue(result.qp > secondQp, 'Reencode should suggest an even higher QP');

            // Test Case 13: Re-encode Max Attempts Reached
            const thirdQp = result.qp;
            result = controller.OnEncodedFrame(now + 34, largeFrameSizeBytes, thirdQp, false); // Same timestamp
            assert.isFalse(result.reencode, 'OnEncodedFrame should not signal reencode after max attempts');
            assert.strictEqual(controller.reEncodeContext.count, 0, 'Reencode count should be reset');
            const finalFullness = (controller.bitDebt / controller.maxBufferLevelBits) * 100;
            assert.isTrue(finalFullness > targetFullness + overshoot, 'Bit debt should be updated after max reencode attempts');

            // Test Case 14: Re-encode Not Triggered (Frame within bounds)
            now = baseTime + 6000;
            controller = new SimpleRateController('avc', 10, 50, 1000000, 30, now, 500, 70, 0.5, 0.1, 90, 20, 20, 2);
            controller.avgQp = 30; // Reset avgQp
            controller.bitDebt = controller.targetBufferLevelBits;
            nextQp = controller.GetNextQp(now + 1, false);
            const normalFrameSizeBytes = Math.floor((controller.targetBitrate / controller.framerate) / 8);
            result = controller.OnEncodedFrame(now + 1, normalFrameSizeBytes, nextQp, false);
            assert.isFalse(result.reencode, 'OnEncodedFrame should not signal reencode for a normal frame');
            assert.strictEqual(controller.reEncodeContext.count, 0, 'Reencode count should be 0');

            // Test Case 15: Re-encode Trigger on Undershoot
            now = baseTime + 7000;
            const undershoot = 20;
            controller = new SimpleRateController('avc', 10, 50, 1000000, 30, now, 500, targetFullness, 0.5, 0.1, 95, 20, undershoot, 2);
            controller.avgQp = 30; // Reset avgQp
            controller.bitDebt = controller.targetBufferLevelBits;
            nextQp = controller.GetNextQp(now + 1, false); // Call to set targetSize
            const undershootQp = 30; // Force mid-range QP
             // This frame size will push the potential buffer level below targetFullness - undershoot
            const smallFrameSizeBytes = Math.floor(((controller.maxBufferLevelBits * Math.max(0, targetFullness - undershoot - 50)) / 100 - controller.bitDebt) / 8);
            result = controller.OnEncodedFrame(now + 1, smallFrameSizeBytes, undershootQp, false);
            assert.isTrue(result.reencode, 'OnEncodedFrame should signal reencode for undershoot');
            assert.strictEqual(controller.reEncodeContext.count, 1, 'Reencode count should be incremented for undershoot');
            assert.isTrue(result.qp < undershootQp, 'Reencode should suggest a lower QP for undershoot');
        }

        // Run all tests
        window.onload = () => {
            runFrameAssemblerTests();
            runSimpleRateControllerTests();
            assert.summary();
        };
    </script>
</body>
